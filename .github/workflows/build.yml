name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Cari folder proyek otomatis (tempat settings.gradle.kts berada),
      # jadi tetap jalan walau file ter-upload ke dalam subfolder.
      - name: Find project directory
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ditemukan. Isi repo:"
            ls -R | head -n 60
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Proyek ada di: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AlatIOS-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
